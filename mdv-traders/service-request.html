<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Water Purifier Service Online | MDV Traders</title>
  <meta name="description" content="Book RO installation, repair, filter change, AMC or relocation online. Choose your preferred date and time – MDV Traders will call you to confirm.">
  <link rel="canonical" href="https://mdvtraders.in/service-request.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MDV Traders">
  <meta property="og:title" content="Request a Service | MDV Traders">
  <meta property="og:description" content="Book a water purifier technician visit in under a minute.">
  <meta property="og:url" content="https://mdvtraders.in/service-request.html">
  <meta property="og:image" content="https://mdvtraders.in/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="request">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-banner">
      <div class="container">
        <h1>Request a Service</h1>
        <p>Fill in the details below. We'll call you to confirm the technician visit.</p>
      </div>
    </section>

    <section class="section">
      <div class="container form-layout">
        <div class="form-card">
          <!-- data-form="service" tells script.js to validate and send this form -->
          <form data-form="service" novalidate>
            <p class="muted" style="margin-top:0">Fields marked <span class="req" style="color:var(--error)">*</span> are required.</p>

            <div class="form-grid">
              <div class="field field--full">
                <label for="fullName">Full Name <span class="req" aria-hidden="true">*</span></label>
                <input type="text" id="fullName" name="fullName" autocomplete="name" maxlength="100" required aria-describedby="fullName-error">
                <p class="error-msg" id="fullName-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="mobile">Mobile Number <span class="req" aria-hidden="true">*</span></label>
                <input type="tel" id="mobile" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="10-digit mobile number" required aria-describedby="mobile-error">
                <p class="error-msg" id="mobile-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="altMobile">Alternate Number <span class="hint">(optional)</span></label>
                <input type="tel" id="altMobile" name="altMobile" inputmode="numeric" maxlength="14" aria-describedby="altMobile-error">
                <p class="error-msg" id="altMobile-error" aria-live="polite"></p>
              </div>

              <div class="field field--full">
                <label for="email">Email <span class="hint">(optional)</span></label>
                <input type="email" id="email" name="email" autocomplete="email" maxlength="150" aria-describedby="email-error">
                <p class="error-msg" id="email-error" aria-live="polite"></p>
              </div>

              <div class="field field--full">
                <label for="address">Full Address <span class="req" aria-hidden="true">*</span></label>
                <textarea id="address" name="address" rows="3" autocomplete="street-address" maxlength="500" placeholder="House / flat no., street, area, landmark, city" required aria-describedby="address-error"></textarea>
                <p class="error-msg" id="address-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="pincode">Pincode <span class="req" aria-hidden="true">*</span></label>
                <input type="text" id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6-digit pincode" required aria-describedby="pincode-error">
                <p class="error-msg" id="pincode-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="product">Product Brand / Model <span class="hint">(optional)</span></label>
                <input type="text" id="product" name="product" maxlength="150" placeholder="e.g. Kent Grand Plus" aria-describedby="product-error">
                <p class="error-msg" id="product-error" aria-live="polite"></p>
              </div>

              <div class="field field--full">
                <label for="serviceType">Service Type <span class="req" aria-hidden="true">*</span></label>
                <select id="serviceType" name="serviceType" required aria-describedby="serviceType-error">
                  <option value="">-- Select a service --</option>
                  <option value="Installation">Installation</option>
                  <option value="Repair">Repair</option>
                  <option value="Filter/Membrane Change">Filter / Membrane Change</option>
                  <option value="AMC">AMC</option>
                  <option value="Uninstall/Relocate">Uninstall / Relocate</option>
                  <option value="Other">Other</option>
                </select>
                <p class="error-msg" id="serviceType-error" aria-live="polite"></p>
              </div>

              <div class="field field--full">
                <label for="problem">Problem Description <span class="hint">(optional)</span></label>
                <textarea id="problem" name="problem" rows="4" maxlength="1000" placeholder="e.g. Water flow is very slow, water tastes salty, leakage from the tap…" aria-describedby="problem-error"></textarea>
                <p class="error-msg" id="problem-error" aria-live="polite"></p>
              </div>

              <div class="field">
                <label for="preferredDate">Preferred Date <span class="req" aria-hidden="true">*</span></label>
                <!-- data-min-today: script.js blocks past dates -->
                <input type="date" id="preferredDate" name="preferredDate" data-min-today required aria-describedby="preferredDate-error">
                <p class="error-msg" id="preferredDate-error" aria-live="polite"></p>
              </div>

              <fieldset class="field">
                <legend>Preferred Time Slot <span class="req" aria-hidden="true">*</span></legend>
                <div class="radio-group">
                  <label class="radio-pill"><input type="radio" name="timeSlot" value="Morning (9 AM – 12 PM)" aria-describedby="timeSlot-error"><span>Morning</span></label>
                  <label class="radio-pill"><input type="radio" name="timeSlot" value="Afternoon (12 PM – 4 PM)"><span>Afternoon</span></label>
                  <label class="radio-pill"><input type="radio" name="timeSlot" value="Evening (4 PM – 7 PM)"><span>Evening</span></label>
                </div>
                <p class="error-msg" id="timeSlot-error" aria-live="polite"></p>
              </fieldset>

              <!-- Honeypot: hidden field. Real people never fill it; spam bots do. -->
              <div class="hp-field" aria-hidden="true">
                <label for="website">Leave this field empty</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
              </div>

              <div class="field field--full">
                <label class="check" for="agree">
                  <input type="checkbox" id="agree" name="agree" required aria-describedby="agree-error">
                  <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> <span class="req" aria-hidden="true">*</span></span>
                </label>
                <p class="error-msg" id="agree-error" aria-live="polite"></p>
              </div>

              <div class="field field--full">
                <button class="btn btn--primary btn--block" type="submit">Submit Service Request</button>
              </div>
            </div>

            <!-- Success / error message appears here -->
            <div class="form-status" role="status" aria-live="polite" hidden></div>
          </form>
        </div>

        <aside class="card aside-card" aria-label="Need help?">
          <h3>Prefer to talk?</h3>
          <ul>
            <li><span data-icon="clock"></span><span>Working hours: <span data-biz="hours"></span></span></li>
            <li><span data-icon="pin"></span><span>Service area: <span data-biz="serviceArea"></span></span></li>
            <li><span data-icon="checkCircle"></span><span>We call back to confirm every request</span></li>
          </ul>
          <div class="btn-row">
            <a class="btn btn--primary btn--block" data-href="tel" href="#"><span data-icon="phone"></span>Call <span data-biz="phone"></span></a>
            <a class="btn btn--whatsapp btn--block" data-href="whatsapp" data-message="Hi MDV Traders, I want to book a service for my water purifier." href="#">WhatsApp Us</a>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
